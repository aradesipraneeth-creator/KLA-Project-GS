# KLA Semiconductor Image Restoration — H100 Remote GPU Training Profile
project_name: "KLA_Semiconductor_Restoration_V2_H100"
model_version: "KLA-HYBRID-V2"
device: "cuda"
amp: true
use_ema: true
ema_decay: 0.999

output_dir: "./outputs/v2"
checkpoint_dir: "./outputs/v2/checkpoints"
val_results_dir: "./outputs/v2/results"
visual_diagnostics_dir: "./outputs/v2/visual_diagnostics"

data:
  lq_train_dir: null  # Auto-resolved
  gt_train_dir: null  # Auto-resolved
  lq_test_dir: null   # Auto-resolved
  val_ratio: 0.1      # Exactly 320 val, 2880 train
  seed: 42
  batch_size: 64      # Optimized for H100 80GB VRAM (45 batches/epoch)
  num_workers: 8      # High throughput data loading
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  patch_size_lq: null # Full 128x128 image
  cache_in_memory: true

model:
  in_channels: 1
  out_channels: 1
  scale: 2
  base_dim: 32
  num_groups: 6
  naf_blocks_per_group: 6
  swin_blocks_per_group: 2
  window_size: 8
  swin_heads: 4
  naf_expansion: 2
  drop_path_rate: 0.0
  use_frequency_guidance: false

loss:
  weight_charbonnier: 0.60
  weight_ssim: 0.25
  weight_fft: 0.15
  charbonnier_eps: 1.0e-3
  ssim_window_size: 11
  curriculum_epochs: 2
  curriculum_warmup_charbonnier: 0.80
  curriculum_warmup_ssim: 0.15
  curriculum_warmup_fft: 0.05

train:
  epochs: 30
  lr: 2.0e-4
  min_lr: 1.0e-6
  warmup_epochs: 2
  val_interval: 1      # Track every epoch on remote GPU
  weight_decay: 1.0e-4
  gradient_accumulation: 1
  clip_grad: 1.0
  torch_compile: false # Optional flag
  gradient_checkpointing: false # Optional flag
